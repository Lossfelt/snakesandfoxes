# Dependabot-konfigurasjon.
#
# Repoet har ingen pakkeavhengigheter, kun GitHub Actions.
# Minor- og patch-oppdateringer samles i én gruppert PR.
# Major-oppdateringer holdes utenfor gruppen og kommer enkeltvis.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
